name: Playwright E2E Tests

on:
  pull_request:
    branches: ['main', 'develop']
  push:
    branches: ['main']

permissions:
  contents: read
  checks: write

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Install Playwright browsers
        run: npm run e2e:install
        working-directory: ./frontend

      - name: Run E2E tests with Docker
        run: |
          for attempt in 1 2; do
            echo "Running E2E attempt ${attempt}/2"
            if npm run test:e2e:docker; then
              exit 0
            fi

            if [ "$attempt" -eq 2 ]; then
              echo "E2E tests failed after retry."
              exit 1
            fi

            echo "Retrying E2E tests after cleanup..."
            docker compose -f ../docker-compose.yml down -v || true
            sleep 5
          done
        working-directory: ./frontend
        env:
          CI: true

      - name: Capture Docker Compose logs
        if: always()
        run: |
          mkdir -p frontend/test-results
          docker compose -f docker-compose.yml logs --no-color > frontend/test-results/docker-compose.log || true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Detect JUnit report
        if: always()
        id: junit
        run: |
          if [ -f frontend/test-results/junit.xml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload JUnit Report
        if: always() && steps.junit.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit
          path: frontend/test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish Test Results
        if: always() && steps.junit.outputs.exists == 'true'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: frontend/test-results/junit.xml

      - name: Skip publish when JUnit is missing
        if: always() && steps.junit.outputs.exists != 'true'
        run: echo "JUnit report not found; skipping unit test result publishing."

      - name: Ensure Docker Compose is down
        if: always()
        run: docker compose -f docker-compose.yml down -v || true
