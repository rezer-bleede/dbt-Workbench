name: Playwright E2E Tests

on:
  pull_request:
    branches: ['main', 'develop']
  push:
    branches: ['main']

permissions:
  contents: read
  checks: write

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Temporarily disable E2E execution
        run: echo "Playwright E2E is temporarily disabled."
